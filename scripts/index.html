<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饺子馆选址评估 · v1.0</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    margin:0; padding:20px; background:#f5f5f5; color:#333; max-width:980px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 8px; }
  h2 { font-size:16px; margin:20px 0 10px; padding-bottom:6px; border-bottom:2px solid #e8e8e8; }
  h3 { font-size:14px; margin:12px 0 6px; color:#555; }
  .card { background:#fff; border-radius:10px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .muted { color:#888; font-size:12px; }
  label { display:block; font-size:13px; margin:8px 0 3px; color:#444; font-weight:500; }
  label .req { color:#d33; }
  input[type="text"], select, textarea { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; font-family:inherit; }
  input[type="range"] { width:100%; accent-color:#e67e22; }
  input:focus, select:focus { border-color:#e67e22; outline:none; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .btn { display:inline-block; padding:11px 26px; background:#e67e22; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn:hover { background:#d35400; }
  .btn-ghost { background:#fff; color:#e67e22; border:1px solid #e67e22; }
  .btn-sm { padding:5px 12px; font-size:12px; margin-top:0; }
  .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; margin-right:5px; }
  .tag-mock { background:#fff3cd; color:#856404; }
  .tag-amap { background:#d1ecf1; color:#0c5460; }
  .tag-baidu { background:#d4edda; color:#155724; }
  .example-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .warn-note { background:#fff8e1; padding:8px 12px; border-radius:6px; border-left:4px solid #f39c12; font-size:12px; margin:6px 0; }
  .good-note { background:#e8f5e9; padding:8px 12px; border-radius:6px; border-left:4px solid #27ae60; font-size:12px; margin:6px 0; }
  .dim-head { display:flex; justify-content:space-between; font-size:12px; }
  .dim-bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; }
  .dim-bar > div { height:100%; border-radius:4px; transition:width .5s ease; }

  /* ===== 首屏三块 ===== */
  .verdict-row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .verdict-big { font-size:48px; font-weight:800; line-height:1; }
  .verdict-pass { color:#27ae60; } .verdict-warn { color:#f39c12; } .verdict-fail { color:#c0392b; }
  .first-blocks { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .block { border-radius:10px; padding:14px; font-size:13px; }
  .block h3 { margin:0 0 10px; font-size:13px; font-weight:700; }
  .block-earning { background:linear-gradient(135deg,#fff3e0,#ffe0b2); }
  .block-risk    { background:linear-gradient(135deg,#ffebee,#ffcdd2); }
  .block-action  { background:linear-gradient(135deg,#e8f5e9,#c8e6c9); }
  .kv { margin:4px 0; }
  .kv .v { font-weight:700; font-size:14px; color:#333; }
  .kv .s { font-size:11px; color:#888; margin-top:2px; }
  .risk-item { padding:6px 8px; background:rgba(255,255,255,.6); border-radius:6px; margin:4px 0; }
  .risk-item .name { font-weight:700; }
  .risk-item .prob { font-size:11px; background:#c0392b; color:#fff; padding:1px 6px; border-radius:3px; margin-left:6px; }
  .action-item { padding:6px 8px; background:rgba(255,255,255,.6); border-radius:6px; margin:4px 0; }
  .action-item .risk { color:#888; font-size:11px; }
  .action-item .act { font-weight:600; margin-top:2px; }

  /* ===== 敏感性面板 ===== */
  .sens-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; align-items:center; }
  .sens-row .col { padding:0 4px; }
  .sens-val { font-size:18px; font-weight:800; color:#e67e22; }
  .sens-label { font-size:11px; color:#888; margin-top:4px; }
  .sens-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .sens-stat { background:#fafafa; border-radius:6px; padding:8px; text-align:center; font-size:12px; }
  .sens-stat .v { font-size:18px; font-weight:800; color:#333; }
  .sens-stat.changed { color:#e67e22; }

  /* ===== 图表容器 ===== */
  .chart-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .chart-box { background:#fafafa; border-radius:8px; padding:10px; }
  .chart-box h4 { margin:0 0 6px; font-size:12px; color:#555; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:12px; }
  .bar-row .lbl { width:90px; }
  .bar-row .barflex { flex:1; height:16px; background:#eee; border-radius:3px; overflow:hidden; }
  .bar-row .bar { height:100%; border-radius:3px; }
  .bar-row .v { width:60px; text-align:right; font-weight:700; }
  .ring-wrap { display:flex; justify-content:center; }

  @media print { body { max-width:none; } .no-print { display:none; } }
  @media (max-width:700px) { .row,.row-3,.first-blocks,.sens-row,.chart-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- ============ 表单 ============ -->
<section id="form-section" class="card">
  <h1>🥟 饺子馆选址评估 <span class="muted">· v1.0 · 业务语言</span></h1>
  <p class="muted">输入 → 评估 → 三个"老板视角"结论卡 + 敏感性拖动条</p>

  <div class="example-bar">
    <span class="muted">快速载入：</span>
    <button class="btn btn-sm btn-ghost" onclick="loadExample('good')">① 社区旺铺·高分</button>
    <button class="btn btn-sm btn-ghost" onclick="loadExample('warn')">② 商圈中等·谨慎</button>
    <button class="btn btn-sm btn-ghost" onclick="loadExample('bad')">③ 偏远冷门·不建议</button>
    <button class="btn btn-sm btn-ghost" onclick="loadExample('missing')">④ 缺租金·位置-only</button>
  </div>

  <div class="provider-bar" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
    <label style="margin:0;">数据源</label>
    <select id="provider-select" style="max-width:160px;" onchange="toggleKeys()">
      <option value="mock">🟢 Mock（离线）</option>
      <option value="amap">🟡 高德 Web</option>
      <option value="baidu">🔵 百度 Place</option>
    </select>
    <input type="text" id="amap-key" placeholder="高德 Key（留空回落 Mock）" style="max-width:280px;display:none;">
    <input type="text" id="baidu-key" placeholder="百度 Key（留空回落 Mock）" style="max-width:280px;display:none;">
    <label style="margin-left:8px;">精度</label>
    <select id="tier-select" style="max-width:140px;">
      <option value="basic">Basic（8 次调用）</option>
      <option value="plus">Plus（多环+全量）</option>
    </select>
    <span id="provider-status" class="tag tag-mock">当前：Mock</span>
  </div>

  <form id="assess-form">
    <h3>📍 地址 & 基础</h3>
    <label>地址 <span class="req">*</span></label>
    <input type="text" id="f-address" placeholder="例：北京朝阳建国路 88 号" required>
    <div class="row">
      <div><label>面积 <span class="req">*</span>（㎡）</label><input type="number" id="f-area" placeholder="例 80" min="1"></div>
      <div>
        <label>月租金（可选 · 留空则只评位置）</label>
        <input type="number" id="f-rent" placeholder="例 8000" min="0">
      </div>
    </div>

    <h3>🚶 动线三段选择 <span class="req">*</span></h3>
    <div class="row">
      <div>
        <label>到最近地铁口</label>
        <select id="f-walk">
          <option value="direct">A. 地铁口出来就到（0m）</option>
          <option value="detour_le_100">B. 要绕一下（≤100m）</option>
          <option value="detour_gt_100">C. 绕路较远（>100m）</option>
          <option value="no_subway">D. 附近没地铁</option>
        </select>
      </div>
      <div>
        <label>门头展示</label>
        <select id="f-road">
          <option value="main_road_with_display">临主干道 · 门头很显眼</option>
          <option value="main_road_no_display">临主干道 · 门头容易被挡</option>
          <option value="not_main_road">不在主干道上</option>
        </select>
      </div>
    </div>

    <h3>⏱ 四时段蹲点客流 <span class="req">*</span>（每 30 分钟通行人数，整数 0–200）</h3>
    <p class="muted">蹲点口径 = 每 30 分钟走过店铺门口 1 米的人数，<b>不论进店与否</b>。工作日午 12:00–12:30、工作日晚 18:00–18:30、周末同时段。</p>
    <div class="row-4">
      <div><label>工作日午市</label><input type="number" id="f-wd-lunch" min="0" max="200" step="1" placeholder="整数"></div>
      <div><label>工作日晚市</label><input type="number" id="f-wd-dinner" min="0" max="200" step="1" placeholder="整数"></div>
      <div><label>周末午市</label><input type="number" id="f-we-lunch" min="0" max="200" step="1" placeholder="整数"></div>
      <div><label>周末晚市</label><input type="number" id="f-we-dinner" min="0" max="200" step="1" placeholder="整数"></div>
    </div>

    <h3>📋 选填档位（下拉更准）</h3>
    <div class="row-4">
      <div>
        <label>客单价（元）</label>
        <select id="f-price">
          <option value="">默认 30</option>
          <option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option>45</option>
        </select>
      </div>
      <div>
        <label>外卖占比</label>
        <select id="f-takeout">
          <option value="0">0%</option><option value="20">20%</option>
          <option value="40" selected>40%</option>
          <option value="60">60%</option><option value="80">80%</option><option value="100">100%</option>
        </select>
      </div>
      <div>
        <label>餐饮经验</label>
        <select id="f-exp">
          <option value="0">0 年（首次）</option><option value="1">1 年</option>
          <option value="2">2–3 年</option><option value="4">5+ 年</option>
        </select>
      </div>
      <div>
        <label>自营/加盟</label>
        <select id="f-mode"><option value="self">自营</option><option value="franchise">加盟</option></select>
      </div>
    </div>

    <button type="button" class="btn" onclick="runAssessment()">🚀 开始评估</button>
  </form>
</section>

<!-- ============ 报告 ============ -->
<div id="report-section" hidden></div>
<div id="sens-section" hidden></div>

<script src="engine.js"></script>
<script>
// ============================================================
//  UI 层：只负责收集 → 调用 engine → 渲染
//  Engine 是单一事实来源
// ============================================================

// ---------- SELF-TEST（v1.4 新增）----------
// 触发：URL ?selftest=1  → 页面加载后自动跑 ENGINE.runSelftest()
// 目的：最便宜的 CI 替代，每次打开带参数的页面就是一次全量回归
(function() {
  const params = new URLSearchParams(location.search);
  if (!params.has("selftest")) return;

  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;padding:10px 20px;font-size:13px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;"
    + "box-shadow:0 2px 8px rgba(0,0,0,.15);";
  bar.style.background = "#2196F3";
  bar.style.color = "#fff";
  bar.textContent = "⏳ 引擎自检中...";
  document.body.insertBefore(bar, document.body.firstChild);
  // 页面已经渲染了 form section 在上部，加个顶部 padding 避免条被挡
  document.body.style.paddingTop = "44px";

  try {
    const r = ENGINE.runSelftest();
    if (r.allPassed) {
      bar.style.background = "#27ae60";
      bar.innerHTML = `✅ 引擎自检通过 · 模型 v${r.catVersion} · ${r.total} 条断言 · ${r.duration}ms`;
      // 在 console 也输出完整结果方便复制
      console.log("%c=== SELFTEST ALL PASSED ===", "color:#27ae60;font-weight:bold");
      console.log(`version: ${r.catVersion}, total: ${r.total}, duration: ${r.duration}ms`);
    } else {
      bar.style.background = "#c0392b";
      const failList = r.fail.map(f => `<span style="margin-left:14px;">❌ ${f.label}: ${f.error}</span>`).join("<br>");
      bar.innerHTML = `❌ 引擎自检 <b>${r.fail.length}/${r.total}</b> 条失败 · v${r.catVersion}<br>${failList}`;
      console.log("%c=== SELFTEST FAILED ===", "color:#c0392b;font-weight:bold");
      for (const f of r.fail) console.error(`❌ ${f.label}: ${f.error}`);
    }
  } catch (e) {
    bar.style.background = "#c0392b";
    bar.innerHTML = `❌ 自检执行异常: ${e.message}`;
  }
})();

const MODEL_VERSION = "1.0";
const EVAL_DATE = new Date().toISOString().slice(0,10);

function readForm() {
  const num = id => { const v = document.getElementById(id).value; const n = Number(v); return isNaN(n) ? null : n; };
  return {
    address: document.getElementById("f-address").value.trim(),
    area:    num("f-area"),
    rent:    num("f-rent"),
    wd_lunch:  num("f-wd-lunch"),
    wd_dinner: num("f-wd-dinner"),
    we_lunch:  num("f-we-lunch"),
    we_dinner: num("f-we-dinner"),
    walk:   document.getElementById("f-walk").value,
    road:   document.getElementById("f-road").value,
    price:  num("f-price"),
    takeout_ratio: num("f-takeout") || 40,
    exp:    num("f-exp"),
    mode:   document.getElementById("f-mode").value
  };
}

function loadExample(which) {
  const f = document.getElementById("assess-form");
  ["f-rent","f-area","f-wd-lunch","f-wd-dinner","f-we-lunch","f-we-dinner","f-price"].forEach(id => document.getElementById(id).value = "");

  if (which === "good") {
    document.getElementById("f-address").value = "北京市朝阳区望京东路 6 号";
    document.getElementById("f-area").value = 85;
    document.getElementById("f-rent").value = 8000;
    document.getElementById("f-wd-lunch").value = 9; document.getElementById("f-wd-dinner").value = 11;
    document.getElementById("f-we-lunch").value = 13; document.getElementById("f-we-dinner").value = 15;
    document.getElementById("f-walk").value = "direct";
  } else if (which === "warn") {
    document.getElementById("f-address").value = "北京市朝阳区国贸 CBD 核心区 88 号";
    document.getElementById("f-area").value = 70;
    document.getElementById("f-rent").value = 15000;
    document.getElementById("f-wd-lunch").value = 10; document.getElementById("f-wd-dinner").value = 8;
    document.getElementById("f-we-lunch").value = 7; document.getElementById("f-we-dinner").value = 10;
    document.getElementById("f-walk").value = "detour_le_100";
  } else if (which === "bad") {
    document.getElementById("f-address").value = "北京市顺义区偏远工业园 3 号楼";
    document.getElementById("f-area").value = 60;
    document.getElementById("f-rent").value = 4000;
    document.getElementById("f-wd-lunch").value = 2; document.getElementById("f-wd-dinner").value = 2;
    document.getElementById("f-we-lunch").value = 3; document.getElementById("f-we-dinner").value = 4;
    document.getElementById("f-walk").value = "no_subway";
    document.getElementById("f-road").value = "not_main_road";
  } else if (which === "missing") {
    document.getElementById("f-address").value = "上海市浦东新区张江路 100 号";
    document.getElementById("f-area").value = 80;
    // 故意不填租金和客流
    document.getElementById("f-walk").value = "detour_le_100";
  }
  document.getElementById("tier-select").value = "basic";
  toggleKeys();
}

function toggleKeys() {
  const s = document.getElementById("provider-select").value;
  document.getElementById("amap-key").style.display = (s === "amap") ? "" : "none";
  document.getElementById("baidu-key").style.display = (s === "baidu") ? "" : "none";
  document.getElementById("provider-status").textContent =
    s === "amap" ? "当前：高德 Web" : s === "baidu" ? "当前：百度 Place" : "当前：Mock";
}

// ---------- Provider 选择 ----------
function chooseProvider() {
  const s = document.getElementById("provider-select").value;
  const amapKey = document.getElementById("amap-key").value.trim();
  const baiduKey = document.getElementById("baidu-key").value.trim();
  if (s === "amap" && amapKey) return new ENGINE.AmapProvider(amapKey);
  if (s === "baidu" && baiduKey) return new ENGINE.BaiduProvider(baiduKey);
  // Mock：根据地址智能选场景
  const addr = document.getElementById("f-address").value.toLowerCase();
  let scene = "community_good";
  if (addr.includes("cbd") || addr.includes("国贸") || addr.includes("金融街")) scene = "business_warn";
  else if (addr.includes("远郊") || addr.includes("偏远") || addr.includes("工业园") || addr.includes("新区")) scene = "remote_bad";
  return new ENGINE.MockProvider(scene);
}

// ---------- 采集 POI ----------
let __CALL_COUNT = 0; // 本次评估实际调用次数

async function collectPOI(provider, lng, lat, tier, cache) {
  // 高德类型码（2026-11-03 实测望京校验）
  const types = [
    {k:"residential", t:"120300"},
    {k:"office",      t:"120201"},
    {k:"school",      t:"141200"},
    {k:"dining",      t:"050000"},
    {k:"subway",      t:"150500"}
  ];
  // 竞品拆分：direct=饺子店 050101（核心竞争）+ substitute=面食/面馆 050102（替代竞争）
  const DIRECT_COMP_CODE   = "050101";
  const SUB_COMP_CODE      = "050102";
  // 旧版 combined（保留 fallback）
  const COMBINED_COMP_CODE = "050100|050101|050102";

  const pois = {};
  if (tier === "basic") {
    for (const {k, t} of types) pois[k] = await cachedSearch(cache, provider, lng, lat, 500, t, tier);
    pois.competitor_direct   = await cachedSearch(cache, provider, lng, lat, 500, DIRECT_COMP_CODE,   tier);
    pois.competitor_substitute = await cachedSearch(cache, provider, lng, lat, 500, SUB_COMP_CODE, tier);
    // 兼容旧版（mock 可能还返回 combined）
    pois.competitor = pois.competitor_direct; // 让 fallback 能工作
  } else {
    for (const {k, t} of types) {
      pois[k+"_500"]  = await cachedSearch(cache, provider, lng, lat, 500,  t, tier);
      pois[k+"_1000"] = await cachedSearch(cache, provider, lng, lat, 1000, t, tier);
    }
    pois.competitor_direct     = await cachedSearch(cache, provider, lng, lat, 500, DIRECT_COMP_CODE,   tier);
    pois.competitor_substitute = await cachedSearch(cache, provider, lng, lat, 500, SUB_COMP_CODE,     tier);
    pois.competitor = pois.competitor_direct;
  }
  pois.__tier = tier;
  return pois;
}

function cachedSearch(cache, provider, lng, lat, radius, types, tier) {
  const key = [lng.toFixed(4), lat.toFixed(4), radius, types, provider.name(), tier];
  const hit = cache.get("poi", key);
  if (hit) { hit.__cached = true; return hit; }
  __CALL_COUNT++; // 只计非缓存命中的真实调用
  return provider.search_poi(lng, lat, radius, types).then(v => { cache.set("poi", v, key); return v; });
}

// ---------- 主流程 ----------
let __LAST_STATE = null; // 保存敏感性分析的基础状态

async function runAssessment() {
  const form = document.getElementById("assess-form");
  const data = readForm();
  const reportEl = document.getElementById("report-section");
  const sensEl = document.getElementById("sens-section");
  reportEl.hidden = true; sensEl.hidden = true;
  reportEl.innerHTML = "<p class='muted'>⏳ 评估中...</p>";
  reportEl.hidden = false;

  __CALL_COUNT = 0; // 重置本次评估调用计数

  try {
    const provider = chooseProvider();
    const tier = document.getElementById("tier-select").value;
    const cache = ENGINE.makeCache();

    // geocode（直接坐标输入跳过 geocode，不计调用）
    let wgs;
    if (/^\d+\.\d+\s*[,，]\s*\d+\.\d+$/.test(data.address.trim())) {
      const [lng, lat] = data.address.split(/[,，]/).map(Number);
      wgs = { lng, lat };
    } else {
      const cached = cache.get("geocode", [data.address, provider.name()]);
      wgs = cached || await provider.geocode(data.address);
      if (!cached) {
        cache.set("geocode", wgs, [data.address, provider.name()]);
        __CALL_COUNT++; // geocode 真实调用 +1
      }
    }
    const extra = (provider.mockSceneExtra && provider.mockSceneExtra()) || {};
    const pois = await collectPOI(provider, wgs.lng, wgs.lat, tier, cache);

    // Engine pipeline
    const cat = ENGINE.loadCategory("dumpling");
    const metrics = ENGINE.computeAllMetrics({ wgs, pois, input: data, extra, category: cat });
    const conf = ENGINE.determineConfidence(data);
    const scores = ENGINE.computeScores(metrics, conf);
    const verdict = ENGINE.verdict(scores._displayTotal, scores._hasRent, scores._rawTotal, metrics.anomalies, conf);
    const biz = ENGINE.toBizLanguage(metrics, conf);
    const firstBlocks = ENGINE.buildFirstScreen(metrics, scores, biz, scores._hasRent);

    __LAST_STATE = { data, wgs, pois, metrics, scores, verdict, biz, firstBlocks, cat, conf, tier, providerName: provider.name(), callCount: __CALL_COUNT };

    renderReport(__LAST_STATE);
    renderSensPanel(__LAST_STATE);
    reportEl.hidden = false; sensEl.hidden = false;
    reportEl.scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    reportEl.innerHTML = `<div class="card"><h3>❌ 评估失败</h3><p>${e.message}</p></div>`;
    reportEl.hidden = false;
  }
}

  const { low, hi } = biz.revenueRange;
  const width = 320, height = 80;
  const lowY = height - 30, hiY = height - 30;
  const loPct = Math.round(low / (hi * 1.2) * 100);

<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">

function renderRingPOI(metrics) {
  const items = [
    { name:"住宅", v:metrics.house500, color:"#e67e22" },
    { name:"写字楼", v:metrics.office,   color:"#27ae60" },
    { name:"学校", v:metrics.school,    color:"#3498db" },
    { name:"餐饮", v:metrics.dining,    color:"#9b59b6" },
    { name:"地铁", v:metrics.subway,    color:"#c0392b" }
  ];
  const total = items.reduce((s,i)=>s+i.v, 0) || 1;
  let cum = 0, paths = "";
  const cx = 110, cy = 110, r1 = 60, r2 = 36;
  for (const it of items) {
    const pct = it.v / total;
    if (pct <= 0) continue;
    const a0 = cum * 2*Math.PI - Math.PI/2;
    const a1 = (cum + pct) * 2*Math.PI - Math.PI/2;
    cum += pct;
    const x0 = cx + r1*Math.cos(a0), y0 = cy + r1*Math.sin(a0);
    const x1 = cx + r1*Math.cos(a1), y1 = cy + r1*Math.sin(a1);
    const x2 = cx + r2*Math.cos(a1), y2 = cy + r2*Math.sin(a1);
    const x3 = cx + r2*Math.cos(a0), y3 = cy + r2*Math.sin(a0);
    const large = pct > 0.5 ? 1 : 0;
    paths += `<path d="M${x0},${y0} A${r1},${r1} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r2},${r2} 0 ${large} 0 ${x3},${y3} Z" fill="${it.color}" opacity=".85"/>`;
  }
  return `<h4>🍩 500m POI 环图（总 ${total} 个）</h4>
<div class="ring-wrap"><svg width="220" height="220" viewBox="0 0 220 220">${paths}
  <circle cx="${cx}" cy="${cy}" r="${r2-4}" fill="#fff"/>
  <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700">${total}</text>
  <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#888">POI 总数</text>
</svg></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;justify-content:center;font-size:11px;">
  ${items.map(i=>`<span><span style="display:inline-block;width:10px;height:10px;background:${i.color};vertical-align:middle;border-radius:2px;"></span> ${i.name} ${i.v}</span>`).join("")}
</div>`;
}

function renderCompBar(metrics) {

  const direct = metrics.directCompCount || 0;

  const bars = [

    { k:"替代竞品（面食/面馆）", v:sub, max:12, col:"#f39c12" },
    { k:"写字楼（白领）", v:metrics.office, max:10, col:"#27ae60" },
    { k:"学校", v:metrics.school, max:10, col:"#9b59b6" },
    { k:"地铁站", v:metrics.subway, max:5, col:"#c0392b" }

  const rows = bars.map(b => {
    const pct = Math.min(100, b.v/b.max*100);
    return `<div class="bar-row"><span class="lbl">${b.k}</span><div class="barflex"><div class="bar" style="width:${pct}%;background:${b.col};"></div></div><span class="v">${b.v}/${b.max}</span></div>`;

  return `<h4>🏪 周边关键指标对比</h4>${rows}<p class="muted" style="font-size:11px;margin-top:4px;">竞品按业态拆分：直接竞争（饺子）+ 替代竞争（面食）</p>`;
}

function updateSens(field) {
  if (!__LAST_STATE) return;
  const S = __LAST_STATE;
  const rentEl = document.getElementById("sens-rent");
  const flowEl = document.getElementById("sens-flow");
  const priceEl = document.getElementById("sens-price");

  if (field === "rent") document.getElementById("sens-rent-v").textContent = rentEl.value;
  if (field === "flow") document.getElementById("sens-flow-v").textContent = Number(flowEl.value).toFixed(1) + "×";
  if (field === "price") document.getElementById("sens-price-v").textContent = priceEl.value;

  // Engine 纯函数重算（单一事实来源）
  const baseInput = JSON.parse(JSON.stringify(S.data));
  baseInput.rent = Number(rentEl.value);
  const mult = Number(flowEl.value);
  for (const k of ['wd_lunch','wd_dinner','we_lunch','we_dinner']) {
    if (baseInput[k] !== null && baseInput[k] !== undefined) baseInput[k] = Math.max(0, Math.round(baseInput[k] * mult));
  }
  baseInput.price = Number(priceEl.value);

  const metrics = ENGINE.computeAllMetrics({
    wgs: S.wgs, pois: S.pois, input: baseInput, extra: {}, category: S.cat
  });
  const conf = ENGINE.determineConfidence(baseInput);
  const scores = ENGINE.computeScores(metrics, conf);
  const verdict = ENGINE.verdict(scores._displayTotal, scores._hasRent);

  document.getElementById("s-total").textContent = scores._displayTotal;
  document.getElementById("s-verdict").textContent = verdict.emoji;
  document.getElementById("s-be").textContent = metrics.breakEvenUnits;
  const rev = ENGINE.toBizLanguage(metrics, conf);
  document.getElementById("s-rev").textContent = rev.revenueRange ?
    `${(rev.revenueRange.low/10000).toFixed(1)}–${(rev.revenueRange.hi/10000).toFixed(1)}万` : "—";
}

// ---------- 终端结论卡 ----------
function renderTerminal(data, scores, verdict, confInfo) {
  const pad = (s, n) => String(s).padEnd(n," ");
  const w = 44;
  const line = "╔" + "═".repeat(w-2) + "╗";
  const sep  = "╠" + "═".repeat(w-2) + "╣";
  const end  = "╚" + "═".repeat(w-2) + "╝";
  const row  = (l,r) => "║ " + pad(l,12) + pad(r,w-16) + "║";
  const sf = scores._hasRent ? "" : "（位置-only）";
  return [
    line, row("🥟 饺子选址 · 结论卡", sf.slice(0,10)), sep,
    row("点位", data.address.slice(0,28)),
    row("总分", scores._displayTotal + "/" + verdict.scale + " " + verdict.emoji),
    row("置信度", confInfo.text), sep,
    row("需求侧", scores.demand + "/40"),
    row("位置侧", scores.location + "/25"),
    row("竞争侧", scores.competition + "/20"),
    row("财务侧", scores._hasRent ? scores.financial + "/15" : "未纳入"), sep,
    row("结论", verdict.label), sep,
    row("建议", verdict.advice.slice(0,28)),
    end
  ].join("\n");
}

// ---------- 下载 ----------
function downloadReport() {
  const card = document.getElementById("report-section").innerHTML;
  const full = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>饺子馆选址报告</title>
<style>${document.querySelector("style").textContent}</style></head><body>
${card.replace(/no-print/g,"")}</body></html>`;
  const blob = new Blob([full], { type:"text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `饺子选址报告_${EVAL_DATE}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
