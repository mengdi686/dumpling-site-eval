<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饺子馆选址评估 · v0.1</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 20px; background: #f5f5f5; color: #333;
    max-width: 960px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #e8e8e8; }
  h3 { font-size: 14px; margin: 16px 0 8px; color: #555; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .muted { color: #888; font-size: 12px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #444; font-weight: 500; }
  label .req { color: #d33; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { border-color: #e67e22; outline: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .btn {
    display: inline-block; padding: 12px 28px; background: #e67e22; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; margin-top: 16px;
  }
  .btn:hover { background: #d35400; }
  .btn-ghost { background: #fff; color: #e67e22; border: 1px solid #e67e22; }
  .btn-sm { padding: 6px 14px; font-size: 13px; margin-top: 0; }
  .provider-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .provider-bar select, .provider-bar input { flex: 1; min-width: 180px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 6px; }

  .tag-baidu { background: #d4edda; color: #155724; }

  /* 报告区域 */

  .verdict-big { font-size: 48px; font-weight: 800; line-height: 1; }
  .verdict-pass { color: #27ae60; }
  .verdict-warn { color: #f39c12; }
  .verdict-fail { color: #c0392b; }
  .score-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
  .score-bar > div { height: 100%; border-radius: 5px; transition: width .6s ease; }
  .score-item { margin: 8px 0; }
  .score-head { display: flex; justify-content: space-between; font-size: 13px; }
  .metric-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .metric-table th, .metric-table td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
  .metric-table th { background: #fafafa; font-weight: 600; }

    display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 13px;
  }
  .conf-A { background: #27ae60; color: #fff; }
  .conf-B { background: #f39c12; color: #fff; }
  .conf-C { background: #e67e22; color: #fff; }
  .conf-D { background: #c0392b; color: #fff; }
  .radar-wrap { display: flex; justify-content: center; padding: 12px; }

  .suggestion-item.good { border-color: #27ae60; background: #f0fff5; }
  .suggestion-item.bad { border-color: #c0392b; background: #fff5f5; }
  .warn-note { background: #fff3cd; padding: 10px 14px; border-radius: 6px; border-left: 4px solid #f39c12; font-size: 13px; margin: 8px 0; }
  .disclaimer { background: #f9f9f9; padding: 14px; border-radius: 8px; font-size: 12px; color: #666; line-height: 1.6; }
  @media print { body { max-width: none; } .no-print { display: none; } }
  @media (max-width: 600px) { .row, .row-3 { grid-template-columns: 1fr; } }

<body>

<!-- ============ 表单 ============ -->

          <option value="main_road_with_display">临主干道 · 有门头展示</option>
          <option value="main_road_no_display">临主干道 · 无门头展示</option>
          <option value="not_main_road">不临主干道</option>

    </div>

    <h3>📝 选填 6 项（用于建议更精准）</h3>
    <div class="row-3">
      <div><label class="muted">客单价（元）</label><input type="number" id="f-price" placeholder="默认 30"></div>
      <div><label class="muted">堂食:外卖</label><input type="text" id="f-dine_take" placeholder="默认 60:40"></div>
      <div><label class="muted">总预算（万元）</label><input type="number" id="f-budget" placeholder="例如 10"></div>
      <div><label class="muted">转让费（万元）</label><input type="number" id="f-transfer"></div>
      <div><label class="muted">自营/加盟</label>
        <select id="f-mode">
          <option value="self">自营</option><option value="franchise">加盟</option>
        </select>

    <button type="button" class="btn" onclick="runAssessment()">🚀 开始评估</button>
  </form>
</section>

<!-- ============ 报告 ============ -->
<div id="report-section" hidden></div>

<script>
// ============================================================
//  1. 品类参数卡（与 references/categories/dumpling.json 同步）
// ============================================================
const CATEGORY_DATA = {
  category_id: "dumpling",
  category_name: "饺子",
  metrics_conversion_rate: { lunch_order_rate: 0.30, dinner_order_rate: 0.36, dinner_time_factor: 1.2 },
  financial_constants: {
    avg_price_default: 30, margin_dinein_default: 0.65, margin_takeout_default: 0.54,
    labor_estimate_wan: 1.5, utility_estimate_wan: 0.5,
    fixed_cost_min_wan: 2.5, fixed_cost_max_wan: 5.0,
    break_even_dinein_min: 120, break_even_dinein_max: 240,
    break_even_takeout_min: 180, break_even_takeout_max: 350
  },
  competitor_keywords: { amap_types: ["饺子店", "面食", "中式快餐"] },
  size_range: { target_min: 60, target_max: 100 },
  weights: {
    demand: 40, location: 25, competition: 20, financial: 15,
    demand_breakdown: { lunch_units: 15, dinner_units: 15, households: 10 },
    location_breakdown: { subway_distance: 10, walkability: 10, road_visibility: 5 },
    competition_breakdown: { density: 10, strength: 10 },
    financial_breakdown: { rent_ratio: 10, breakeven: 5 }
  }
};
const MODEL_VERSION = "v0.1";
const EVAL_DATE = new Date().toISOString().slice(0,10);

// ============================================================
//  2. 坐标系转换 & Haversine
// ============================================================
const PI = Math.PI, a = 6378245.0, ee = 0.00669342162296594323;
function outOfChina(lng, lat) { return !(73.66 < lng && lng < 135.05 && 3.86 < lat && lat < 53.55); }
function _transformLat(x, y) { let ret = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x)); ret += (20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; ret += (20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3; ret += (160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3; return ret; }
function _transformLng(x, y) { let ret = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x)); ret += (20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; ret += (20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3; ret += (150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3; return ret; }
function wgs84ToGcj02(lng, lat) {
  if (outOfChina(lng, lat)) return [lng, lat];
  let dLat = _transformLat(lng - 105.0, lat - 35.0);
  let dLng = _transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI, magic = Math.sin(radLat);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * magic + (1 - ee)) * PI);
  dLng = (dLng * 180.0) / (a / Math.sqrt(1 - ee * magic * magic) * Math.cos(radLat) * PI);
  return [lng + dLng, lat + dLat];
}
function gcj02ToWgs84(lng, lat) {
  const [gLng, gLat] = wgs84ToGcj02(lng, lat);
  return [lng * 2 - gLng, lat * 2 - gLat];
}
function gcj02ToBd09(lng, lat) {
  const z = Math.sqrt(lng*lng + lat*lat) + 0.00002 * Math.sin(lat * PI * 3000 / 180);
  const theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * PI * 3000 / 180);
  return [z * Math.cos(theta) + 0.0065, z * Math.sin(theta) + 0.006];
}
function bd09ToGcj02(lng, lat) {
  const x = lng - 0.0065, y = lat - 0.006;
  const z = Math.sqrt(x*x + y*y) - 0.00002 * Math.sin(y * PI * 3000 / 180);
  const theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * PI * 3000 / 180);
  return [z * Math.cos(theta), z * Math.sin(theta)];
}
function bd09ToWgs84(lng, lat) { const [gLng, gLat] = bd09ToGcj02(lng, lat); return gcj02ToWgs84(gLng, gLat); }

// Haversine: 接收 [lat, lng]（WGS84），返回米
function haversine(lat1, lng1, lat2, lng2) {
  const toRad = d => d * PI / 180;
  const R = 6371000;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// ============================================================
//  3. Provider 接口 + 三种实现
// ============================================================
class Provider {
  async search_poi(lng, lat, radius, types) { throw 'abstract'; }
  async geocode(address) { throw 'abstract'; }
  async reverse_geocode(lng, lat) { throw 'abstract'; }
  name() { return 'Provider'; }
}

// --- Mock Provider：三套预设场景 + 随机扰动 ---
const MOCK_SCENES = {
  community_good: {  // 社区旺铺：住宅多、地铁近、有竞争但不挤
    name: "社区旺铺·高分场景",
    pois: {
      residential_500: { count: 8, sample: 7 },
      residential_1000: { count: 18, sample: 15 },
      office_500: { count: 2, sample: 1 },
      school_500: { count: 3, sample: 3 },
      mall_500: { count: 1, sample: 0 },
      subway_500: { count: 2, sample: 2 },
      competitor_500: { count: 3, sample: 2 }
    },
    household_estimate: 3800,
    nearest_subway_m: 180,
    competitor_strength: 6.2
  },
  business_warn: {  // 商圈中等：竞争多、租金可能偏高
    name: "商圈中等·谨慎场景",
    pois: {
      residential_500: { count: 2, sample: 2 },
      residential_1000: { count: 6, sample: 5 },
      office_500: { count: 5, sample: 4 },
      school_500: { count: 1, sample: 1 },
      mall_500: { count: 2, sample: 2 },
      subway_500: { count: 1, sample: 1 },
      competitor_500: { count: 8, sample: 6 }
    },
    household_estimate: 1200,
    nearest_subway_m: 450,
    competitor_strength: 7.4
  },
  remote_bad: {  // 偏远冷门
    name: "偏远冷门·不建议场景",
    pois: {
      residential_500: { count: 0, sample: 0 },
      residential_1000: { count: 1, sample: 1 },
      office_500: { count: 0, sample: 0 },
      school_500: { count: 0, sample: 0 },
      mall_500: { count: 0, sample: 0 },
      subway_500: { count: 0, sample: 0 },
      competitor_500: { count: 0, sample: 0 }
    },
    household_estimate: 200,
    nearest_subway_m: null,
    competitor_strength: null
  }
};

class MockProvider extends Provider {
  constructor(scene) { super(); this.scene = scene || "community_good"; }
  name() { return "mock"; }

  async search_poi(lng, lat, radius, types) {
    const s = MOCK_SCENES[this.scene];
    const map = {
      "住宅小区": radius >= 1000 ? s.pois.residential_1000 : s.pois.residential_500,
      "住宅": radius >= 1000 ? s.pois.residential_1000 : s.pois.residential_500,
      "商务办公楼": s.pois.office_500,
      "写字楼": s.pois.office_500,
      "学校": s.pois.school_500,
      "大学": s.pois.school_500,
      "购物中心": s.pois.mall_500,
      "商场": s.pois.mall_500,
      "地铁站": s.pois.subway_500,
      "轨道交通": s.pois.subway_500,
      "饺子店,面食,中式快餐": s.pois.competitor_500,
      "餐饮": s.pois.competitor_500,
      "饺子店": s.pois.competitor_500
    };
    const key = types;
    const entry = map[key];
    if (entry) {
      // 返回 count 条合成 POI（带随机偏移）
      const out = [];
      for (let i = 0; i < entry.count; i++) {
        const a = Math.random() * 2 * PI;
        const r = Math.random() * radius;
        out.push({
          id: "mock_" + i,
          name: key + "_" + i,
          lng: lng + r * Math.cos(a) / 111000,
          lat: lat + r * Math.sin(a) / 111000,
          rating: (3.5 + Math.random() * 1.8).toFixed(1),
          comment_num: Math.floor(50 + Math.random() * 800)
        });
      }
      return out;
    }
    return [];
  }

  async geocode(address) {
    // 根据场景返回硬编码坐标（方便测试）
    const coords = {
      community_good: [116.456, 39.921],   // 北京朝阳
      business_warn: [116.408, 39.914],    // 北京 CBD
      remote_bad:    [116.800, 40.100]     // 远郊
    };
    return { lng: coords[this.scene][0], lat: coords[this.scene][1], formatted_address: address + " (模拟)" };
  }

  async reverse_geocode(lng, lat) {
    return { formatted_address: "模拟地址 " + lng.toFixed(4) + "," + lat.toFixed(4), adcode: "000000" };
  }

  // 额外 mock 方法（非标准 Provider 接口）
  mockSceneExtra() { return MOCK_SCENES[this.scene]; }
}

// --- 高德 Provider ---
class AmapProvider extends Provider {
  constructor(key) { super(); this.key = key; }
  name() { return "amap"; }
  async geocode(address) {
    if (!this.key) throw new Error("no key");
    const u = `https://restapi.amap.com/v3/geocode/geo?address=${encodeURIComponent(address)}&key=${this.key}`;
    const r = await (await fetch(u)).json();
    if (!r.geocodes || !r.geocodes.length) throw new Error("geocode not found");
    const [lng, lat] = r.geocodes[0].location.split(",").map(Number);
    const [wLng, wLat] = gcj02ToWgs84(lng, lat);
    return { lng: wLng, lat: wLat, formatted_address: r.geocodes[0].formatted_address };
  }
  async reverse_geocode(lng, lat) {
    if (!this.key) throw new Error("no key");
    const [gLng, gLat] = wgs84ToGcj02(lng, lat);
    const u = `https://restapi.amap.com/v3/geocode/regeo?location=${gLng},${gLat}&key=${this.key}`;
    const r = await (await fetch(u)).json();
    return { formatted_address: (r.regeocode || {}).formatted_address || "", adcode: (r.regeocode || {}).addressComponent?.adcode };
  }
  async search_poi(lng, lat, radius, types) {
    if (!this.key) throw new Error("no key");
    const [gLng, gLat] = wgs84ToGcj02(lng, lat);
    const u = `https://restapi.amap.com/v3/place/around?location=${gLng},${gLat}&radius=${radius}&types=${encodeURIComponent(types)}&key=${this.key}&offset=25`;
    const r = await (await fetch(u)).json();
    return (r.pois || []).map(p => {
      const [plng, plat] = p.location.split(",").map(Number);
      const [wLng, wLat] = gcj02ToWgs84(plng, plat);
      return {
        id: p.id, name: p.name, lng: wLng, lat: wLat,
        rating: p.biz_ext?.rating || null, comment_num: p.biz_ext?.comment_num || null
      };
    });
  }
}

// --- 百度 Provider ---
class BaiduProvider extends Provider {
  constructor(key) { super(); this.key = key; }
  name() { return "baidu"; }
  async geocode(address) {
    if (!this.key) throw new Error("no key");
    const u = `https://api.map.baidu.com/geocoding/v3/?address=${encodeURIComponent(address)}&output=json&ak=${this.key}`;
    const r = await (await fetch(u)).json();
    if (r.status !== 0) throw new Error("geocode failed: " + r.message);
    const bd = r.result.location;
    const [gLng, gLat] = bd09ToGcj02(bd.lng, bd.lat);
    const [wLng, wLat] = gcj02ToWgs84(gLng, gLat);
    return { lng: wLng, lat: wLat, formatted_address: r.result.formatted_address };
  }
  async reverse_geocode(lng, lat) {
    if (!this.key) throw new Error("no key");
    const [bLng, bLat] = gcj02ToBd09(...wgs84ToGcj02(lng, lat));
    const u = `https://api.map.baidu.com/reverse_geocoding/v3/?location=${bLat},${bLng}&output=json&ak=${this.key}`;
    const r = await (await fetch(u)).json();
    return { formatted_address: (r.result || {}).formatted_address || "" };
  }
  async search_poi(lng, lat, radius, types) {
    if (!this.key) throw new Error("no key");
    const [bLng, bLat] = gcj02ToBd09(...wgs84ToGcj02(lng, lat));
    // 百度 v2 接口：经纬度顺序 lat,lng
    const u = `https://api.map.baidu.com/place/v2/search?query=${encodeURIComponent(types)}&location=${bLat},${bLng}&radius=${radius}&output=json&ak=${this.key}&page_size=20`;
    const r = await (await fetch(u)).json();
    return (r.results || []).map(p => {
      const [gLng, gLat] = bd09ToGcj02(p.location.lng, p.location.lat);
      const [wLng, wLat] = gcj02ToWgs84(gLng, gLat);
      return {
        id: p.uid, name: p.name, lng: wLng, lat: wLat,
        rating: p.detail_info?.overall_rating || null,
        comment_num: p.detail_info?.comment_num || null
      };
    });
  }
}

// ============================================================
//  4. 缓存（localStorage）
// ============================================================
const CACHE_TTL = 30 * 24 * 3600 * 1000; // 30 天（坐标 500m 网格复用）
const cache = {
  _key(prefix, ...parts) { return "dumpling-cache/" + prefix + "/" + parts.join("|"); },
  get(prefix, ...parts) {
    try {
      const raw = localStorage.getItem(this._key(prefix, ...parts));
      if (!raw) return null;
      const { v, t } = JSON.parse(raw);
      if (Date.now() - t > CACHE_TTL) { localStorage.removeItem(this._key(prefix, ...parts)); return null; }
      return v;
    } catch { return null; }
  },
  set(prefix, value, ...parts) {
    localStorage.setItem(this._key(prefix, ...parts), JSON.stringify({ v: value, t: Date.now() }));
  }
};

async function cachedSearch(provider, lng, lat, radius, types, tier) {
  tier = tier || "basic";
  const key = [lng.toFixed(4), lat.toFixed(4), radius, types, provider.name(), tier];
  const hit = cache.get("poi", ...key);
  if (hit) { hit.__cached = true; return hit; }
  const v = await provider.search_poi(lng, lat, radius, types);
  cache.set("poi", v, ...key);
  return v;
}

// ============================================================
//  5. 核心评估：采集 POI → 计算 16 指标 → 评分 → 结论
// ============================================================

async function runAssessment() {
  const form = document.getElementById("assess-form");
  const data = readForm(form);
  const reportEl = document.getElementById("report-section");
  reportEl.hidden = true; reportEl.innerHTML = "<p class='muted'>⏳ 评估中...</p>";
  reportEl.hidden = false;

  try {
    // 5a. 选择 provider
    const ptype = document.getElementById("provider-select").value;
    const amapKey = document.getElementById("amap-key").value.trim();
    const baiduKey = document.getElementById("baidu-key").value.trim();
    let provider, providerName = "mock";

    if (ptype === "amap" && amapKey) {
      provider = new AmapProvider(amapKey); providerName = "amap";
    } else if (ptype === "baidu" && baiduKey) {
      provider = new BaiduProvider(baiduKey); providerName = "baidu";
    } else {
      // 根据表单内容智能选 mock 场景（地址里含"CBD"→business_warn，含"远郊/新区"→remote_bad，其他→community_good）
      let scene = "community_good";
      const addr = (data.address || "").toLowerCase();
      if (addr.includes("cbd") || addr.includes("国贸") || addr.includes("金融街")) scene = "business_warn";
      else if (addr.includes("远郊") || addr.includes("新区") || addr.includes("工业园")) scene = "remote_bad";
      else if (!data.rent) scene = "community_good"; // 缺租金不影响 scene
      // 如果用"偏远"相关词
      if (addr.includes("偏远") || addr.includes("农村")) scene = "remote_bad";
      provider = new MockProvider(scene); providerName = "mock";
    }

    // 5b. 解析坐标
    let wgs;
    if (/^\d+\.\d+\s*[,，]\s*\d+\.\d+$/.test(data.address.trim())) {
      const [lng, lat] = data.address.split(/[,，]/).map(Number);
      wgs = { lng, lat };
    } else {
      const cached = cache.get("geocode", data.address, providerName);
      if (cached) { wgs = cached; wgs.__cached = true; }
      else { wgs = await provider.geocode(data.address); cache.set("geocode", wgs, data.address, providerName); }
    }

    // 5c. 采集 POI（压缩为 5 类 basic；plus 模式多环）
    const tier = document.getElementById("tier-select")?.value || "basic";
    const poiRadius = (tier === "plus") ? [200, 500, 800, 1500] : [500];
    const poiTypes = [
      { key: "residential", types: "住宅小区" },
      { key: "office",      types: "商务办公楼" },
      { key: "school",      types: "学校" },
      { key: "dining",      types: "餐饮服务" },
      { key: "subway",      types: "地铁站" }
    ];
    const pois = {};
    if (tier === "basic") {
      // basic 模式：每类只查 500m 一次，总 5 次 + 竞品明细 1 次
      for (const pt of poiTypes) {
        pois[pt.key] = await cachedSearch(provider, wgs.lng, wgs.lat, 500, pt.types, tier);
      }
      // 竞品明细（同品类：饺子/面食/中式快餐）
      pois.competitor = await cachedSearch(provider, wgs.lng, wgs.lat, 500, CATEGORY_DATA.competitor_keywords.amap_types.join(","), tier);
    } else {
      // plus 模式：多环
      for (const pt of poiTypes) {
        pois[pt.key + "_500"]  = await cachedSearch(provider, wgs.lng, wgs.lat, 500,  pt.types, tier);
        pois[pt.key + "_1000"] = await cachedSearch(provider, wgs.lng, wgs.lat, 1000, pt.types, tier);
      }
      pois.competitor = await cachedSearch(provider, wgs.lng, wgs.lat, 500, CATEGORY_DATA.competitor_keywords.amap_types.join(","), tier);
    }
    pois.__tier = tier;

    // 额外 mock 场景数据（用于 household_estimate 兜底）
    const extra = (provider.mockSceneExtra && provider.mockSceneExtra()) || {};

    // 5d. 计算 16 指标
    const metrics = computeAllMetrics(wgs, pois, data, extra, providerName);

    // 5e. 计算评分
    const conf = determineConfidence(data);
    const scores = computeScores(metrics, CATEGORY_DATA, conf);
    const total = scores._normTotal;
    const v = verdict(total);
    // 无租金时调整结论措辞
    if (!scores._hasRent) {
      if (total >= 80) v.advice = "位置可行性好；建议补上租金后再评估财务维度";
      else if (total >= 60) v.advice = "位置有亮点但也有短板；建议补租金后再确认财务安全垫";
      else v.advice = "位置侧不足以支撑开店判断，建议更换点位";
    }

    // 5f. 商圈类型
    const bizType = inferBizType(pois, data);

    // 5g. 渲染报告
    const reportHTML = renderReport({
      data, wgs, metrics, scores, total, verdict: v,
      confidence: conf, bizType, providerName,
      poiCacheHits: Object.values(pois).filter(p => p.__cached).length,
      categoryName: CATEGORY_DATA.category_name,
      modelVersion: MODEL_VERSION, evalDate: EVAL_DATE,
      extra
    });
    reportEl.innerHTML = reportHTML;
    reportEl.hidden = false;

    // 滚动到报告
    reportEl.scrollIntoView({ behavior: "smooth" });

    // 下载按钮绑定
    document.getElementById("download-report")?.addEventListener("click", () => downloadHTML(reportHTML, `饺子选址报告_${data.address.slice(0,15)}_${EVAL_DATE}.html`));

  } catch (e) {
    reportEl.innerHTML = `<div class="card"><h3>❌ 评估失败</h3><p>${e.message}</p><p class="muted">建议：改用 Mock 数据源，或检查地址格式。</p></div>`;
    reportEl.hidden = false;
  }
}

function readForm(form) {
  return {
    address: form["f-address"].value.trim(),
    rent:    Number(form["f-rent"].value) || null,
    area:    Number(form["f-area"].value) || null,
    wd_lunch:  Number(form["f-wd-lunch"].value) || null,
    wd_dinner: Number(form["f-wd-dinner"].value) || null,
    we_lunch:  Number(form["f-we-lunch"].value) || null,
    we_dinner: Number(form["f-we-dinner"].value) || null,
    walk:   form["f-walk"].value,
    road:   form["f-road"].value,
    price:  Number(form["f-price"].value) || null,
    mode:   form["f-mode"].value,
    exp:    Number(form["f-exp"].value) || null,
    budget: Number(form["f-budget"].value) || null,
    transfer: Number(form["f-transfer"].value) || null
  };
}

// ===== 指标计算 =====
function computeAllMetrics(wgs, pois, data, extra, providerName) {
  // basic 模式 key；plus 模式带 _500 后缀，统一做 fallback
  const resiKey = pois.residential_500 ? "residential_500" : "residential";
  const officeKey = pois.office_500 ? "office_500" : "office";
  const schoolKey = pois.school_500 ? "school_500" : "school";
  const diningKey = pois.dining_500 ? "dining_500" : "dining";
  const subwayKey = pois.subway_500 ? "subway_500" : "subway";

  const house_count_500  = (pois[resiKey] || []).length;
  const house_count_1000 = pois.residential_1000 ? pois.residential_1000.length : house_count_500;
  const office_count     = (pois[officeKey] || []).length;
  const school_count     = (pois[schoolKey] || []).length;
  const dining_count     = (pois[diningKey] || []).length;
  const subway_count     = (pois[subwayKey] || []).length;
  const comp_count       = (pois.competitor || []).length;

  // 7) 500m 家庭户数估算
  let householdEstimate;
  if (extra.household_estimate) householdEstimate = extra.household_estimate;
  else householdEstimate = house_count_500 * 800;

  // 11) 最近地铁距离
  let nearestSubway = null;
  if ((pois[subwayKey] || []).length > 0) {
    nearestSubway = Math.min(...pois[subwayKey].map(s => haversine(wgs.lat, wgs.lng, s.lat, s.lng)));
  } else if (extra.nearest_subway_m !== undefined) {
    nearestSubway = extra.nearest_subway_m;
  }

  // 9) 竞品密度
  const compDensity = comp_count;

  // 10) 竞品强度：avg(rating) * (comment_num 归一化)
  let compStrength = null;
  if (comp_count > 0) {
    const rated = (pois.competitor || []).filter(p => p.rating);
    const avgRating = rated.length ? rated.reduce((s,p) => s + Number(p.rating), 0) / rated.length : 0;
    const comments = (pois.competitor || []).map(p => p.comment_num).filter(Boolean);
    const avgLog = comments.length ? Math.log(comments.reduce((a,b)=>a+b,0)/comments.length + 1) / Math.log(800) : 1;
    compStrength = (avgRating * avgLog).toFixed(2);
  } else if (extra.competitor_strength !== undefined) {
    compStrength = extra.competitor_strength;
  }

  // 蹲点客流 → 预期日单量
  const convRate = CATEGORY_DATA.metrics_conversion_rate;
  let lunchDailyUnits = null, dinnerDailyUnits = null;
  const anyFlow = [data.wd_lunch, data.wd_dinner, data.we_lunch, data.we_dinner].some(v => v !== null && v > 0);
  if (anyFlow) {
    const avgFlowLunch = avgOrFallback([data.wd_lunch, data.we_lunch], 0);
    const avgFlowDinner = avgOrFallback([data.wd_dinner, data.we_dinner], 0);
    lunchDailyUnits = Math.round(avgFlowLunch * 150 * convRate.lunch_order_rate);
    dinnerDailyUnits = Math.round(avgFlowDinner * 150 * convRate.dinner_order_rate * convRate.dinner_time_factor);
  }

  // 商圈类型推断（用于缺失客流时的经验区间）
  const bizType = inferBizType(pois, data);

  // 财务侧（仅当提供租金时计算）
  const price = data.price || CATEGORY_DATA.financial_constants.avg_price_default;
  let rentRatio = null;
  if (data.rent && lunchDailyUnits !== null) {
    const monthlyRevenue = (lunchDailyUnits + dinnerDailyUnits) * price * 30;
    rentRatio = data.rent / monthlyRevenue;
  }

  let breakEvenUnits = null;
  let fixedCostWan = data.rent ? (data.rent / 10000 + CATEGORY_DATA.financial_constants.labor_estimate_wan + CATEGORY_DATA.financial_constants.utility_estimate_wan)
                               : (CATEGORY_DATA.financial_constants.fixed_cost_min_wan + CATEGORY_DATA.financial_constants.fixed_cost_max_wan) / 2;
  const margin = CATEGORY_DATA.financial_constants.margin_dinein_default;
  breakEvenUnits = Math.round(fixedCostWan * 10000 / (price * margin * 30));

  let breakEvenAchieve = null;
  if (data.rent && lunchDailyUnits !== null && breakEvenUnits > 0) {
    breakEvenAchieve = (lunchDailyUnits + dinnerDailyUnits) / breakEvenUnits;
  }

  return {
    house_count_500, house_count_1000, office_count, school_count, dining_count, subway_count, comp_count,
    householdEstimate, nearestSubway, compDensity, compStrength,
    lunchDailyUnits, dinnerDailyUnits,
    rentRatio, breakEvenUnits, breakEvenAchieve,
    price, fixedCostWan,
    walk: data.walk, road: data.road,
    hasRent: !!(data.rent && data.rent > 0),
    dataSource: providerName
  };
}

function avgOrFallback(arr, fb) {
  const valid = arr.filter(v => v !== null && v !== undefined);
  return valid.length ? valid.reduce((a,b)=>a+b,0) / valid.length : fb;
}

function inferBizType(pois, data) {
  const resi = (pois.residential_500 || pois.residential || []).length;
  const off  = (pois.office_500 || pois.office || []).length;
  const sch  = (pois.school_500 || pois.school || []).length;
  const din  = (pois.dining_500  || pois.dining  || []).length;
  const sub  = (pois.subway_500  || pois.subway  || []).length;
  const scores = {
    community: resi * 3 + sch * 2,
    business:  off  * 3 + sub  * 2,
    commercial: din * 3
  };
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if (sorted.length >= 2 && sorted[0][1] - sorted[1][1] < 1) return "混合";
  const map = { community: "社区", business: "商务", commercial: "商业" };
  return map[sorted[0][0]] || "混合";
}

// ===== 置信度（租金可选，不影响置信度；只看客流） =====
function determineConfidence(data) {
  const hasFlow = [data.wd_lunch, data.wd_dinner, data.we_lunch, data.we_dinner].some(v => v !== null && v > 0);
  return hasFlow ? "A" : "B";
}

// ===== 分段打分工具 =====
function scoreByThresholds(value, thresholds, key, isMax) {
  if (value === null || value === undefined) return 0;
  for (const t of thresholds) {
    const ok = isMax ? (value <= t.max && value >= (t.min ?? 0)) : (value >= t.min);
    if (ok) return t.score;
  }
  return 0;
}

function scoreByMin(value, thresholds) {
  if (value === null || value === undefined) return 0;
  // 按 min 倒序找匹配
  const sorted = [...thresholds].sort((a,b) => b.min - a.min);
  for (const t of sorted) if (value >= t.min) return t.score;
  return 0;
}
function scoreByMax(value, thresholds) {
  if (value === null || value === undefined) return 0;
  const sorted = [...thresholds].sort((a,b) => a.max - b.max);
  for (const t of sorted) if (value <= t.max) return t.score;
  return 0;
}

// ===== 评分主函数 =====
function computeScores(m, cat, conf) {
  const W = cat.weights;
  const res = { demand: 0, location: 0, competition: 0, financial: 0 };
  const detail = {};

  // --- 需求侧 40 ---
  let lunchS, dinnerS, houseS;
  if (conf === "B") {
    // 缺客流，按商圈类型经验区间估算
    const biz = m._bizType || "混合";
    const ranges = { "社区": {lunch:45, dinner:55, houses:2200}, "商务":{lunch:55,dinner:45,houses:1500}, "商业":{lunch:65,dinner:75,houses:1800} };
    const fb = ranges[biz] || {lunch:50, dinner:55, houses:1800};
    lunchS  = scoreByMin(fb.lunch,  [ {min:60,score:15},{min:40,score:11},{min:25,score:7},{min:0,score:3} ]);
    dinnerS = scoreByMin(fb.dinner, [ {min:72,score:15},{min:48,score:11},{min:30,score:7},{min:0,score:3} ]);
    houseS  = scoreByMin(m.householdEstimate ?? fb.houses, [ {min:3000,score:10},{min:1500,score:7},{min:800,score:4},{min:1,score:1},{min:0,score:0} ]);
  } else {
    lunchS  = scoreByMin(m.lunchDailyUnits,  [ {min:60,score:15},{min:40,score:11},{min:25,score:7},{min:0,score:3} ]);
    dinnerS = scoreByMin(m.dinnerDailyUnits, [ {min:72,score:15},{min:48,score:11},{min:30,score:7},{min:0,score:3} ]);
    houseS  = scoreByMin(m.householdEstimate, [ {min:3000,score:10},{min:1500,score:7},{min:800,score:4},{min:1,score:1},{min:0,score:0} ]);
  }
  res.demand = lunchS + dinnerS + houseS;
  detail.demand = { lunchS, dinnerS, houseS, max: 40 };

  // --- 位置侧 25 ---
  let subS, walkS, roadS;
  if (m.nearestSubway === null) subS = 0;
  else subS = scoreByMax(m.nearestSubway, [ {max:200,score:10},{max:400,score:7},{max:600,score:4},{max:99999,score:1} ]);
  const walkMap = { direct:10, detour_le_100:7, detour_gt_100:3, no_subway:2 };
  walkS = walkMap[m.walk] ?? 0;
  const roadMap = { main_road_with_display:5, main_road_no_display:2, not_main_road:1 };
  roadS = roadMap[m.road] ?? 1;
  res.location = subS + walkS + roadS;
  detail.location = { subS, walkS, roadS, max: 25 };

  // --- 竞争侧 20 ---
  let densityS, strengthS;
  // density: 注意 0 家不给满分（需求未验证）
  const dc = m.compDensity;
  if (dc === 0) densityS = 6; else if (dc <= 1) densityS = 10;
  else if (dc <= 3) densityS = 7; else if (dc <= 6) densityS = 4; else densityS = 1;
  if (m.compStrength === null) strengthS = (dc === 0) ? 7 : 0;
  else strengthS = scoreByMin(Number(m.compStrength), [ {min:7.0,score:10},{min:5.0,score:6},{min:3.0,score:3},{min:0.01,score:1},{min:0,score:0} ]);
  if (dc === 0 && m.compStrength === null) strengthS = 7;
  res.competition = densityS + strengthS;
  detail.competition = { densityS, strengthS, max: 20 };

  // --- 财务侧 15（仅当提供租金时计算） ---
  let rentS = 0, beS = 0;
  const hasRent = m.hasRent === true;
  if (hasRent) {
    rentS = m.rentRatio === null ? 0 : scoreByMax(m.rentRatio, [ {max:0.15,score:10},{max:0.22,score:7},{max:0.30,score:4},{max:99,score:1} ]);
    beS = m.breakEvenAchieve === null ? 0 : scoreByMin(m.breakEvenAchieve, [ {min:1.5,score:5},{min:1.2,score:3},{min:1.0,score:1},{min:0,score:0} ]);
  }
  res.financial = rentS + beS;
  detail.financial = { rentS, beS, max: hasRent ? 15 : 0, skipped: !hasRent };

  // --- 总分归一化 ---
  // 无租金时只算三维（满分 85），按比例归一到 100
  const rawTotal = res.demand + res.location + res.competition + res.financial;
  const normTotal = hasRent ? rawTotal : Math.round(rawTotal * 100 / 85);
  res._rawTotal = rawTotal;
  res._normTotal = normTotal;
  res._hasRent = hasRent;
  res.detail = detail;
  return res;
}

function verdict(total) {
  if (total >= 80) return { label: "✅ 建议开", emoji: "✅", cls: "pass", advice: "核心指标均达标，竞品压力可控，财务安全垫充足" };
  if (total >= 60) return { label: "⚠️ 谨慎",   emoji: "⚠️", cls: "warn", advice: "有短板，建议补足信息后二次评估" };
  return { label: "❌ 不建议", emoji: "❌", cls: "fail", advice: "至少一个核心维度严重不达标" };
}

// ============================================================
//  6. HTML 报告渲染
// ============================================================
function renderReport(ctx) {
  const { data, wgs, metrics, scores, total, verdict: v, confidence: conf, bizType, providerName, evalDate, modelVersion, poiCacheHits, extra } = ctx;
  const D = scores.detail;

  // —— 优势 & 短板 ——
  const dims = [
    {name:"需求侧", score:scores.demand, max:40, key:"demand"},
    {name:"位置侧", score:scores.location, max:25, key:"location"},
    {name:"竞争侧", score:scores.competition, max:20, key:"competition"},
    {name:"财务侧", score:scores.financial, max:15, key:"financial"}
  ].sort((a,b) => (b.score/b.max) - (a.score/a.max));
  const strengths = dims.slice(0, 2);
  const weaknesses = [...dims].reverse().slice(0, 2);

  // —— 建议 ——
  const suggestions = [];
  if (scores.demand < 28) suggestions.push("需求侧偏弱：当前点位午/晚高峰预估单量偏低，建议实地再蹲点验证或转向社区型商圈");
  if (scores.location < 18) {
    if (D.location.subS <= 4) suggestions.push("地铁距离较远：可达性是饺子店核心客流来源，优先考虑更近地铁口的点位");
    if (D.location.walkS <= 7) suggestions.push("动线绕行：若有绕行超过 100m，建议评估门头是否需要额外指引招牌");
  }
  if (scores.competition < 14) {

  return `

function dimItem(name, score, max, color) {
  const pct = Math.round(score / max * 100);
  return `<div>
    <div class="score-head"><b>${name}</b><span>${score}/${max}（${pct}%）</span></div>
    <div class="score-bar"><div style="width:${pct}%;background:${color};"></div></div>
  </div>`;
}

function renderRadarSVG(axes) {
  const size = 240, cx = size/2, cy = size/2, R = 90;
  const n = axes.length;
  const points = axes.map((a,i) => {
    const ang = -Math.PI/2 + i * 2*Math.PI/n;
    return { x: cx + R*a.val*Math.cos(ang), y: cy + R*a.val*Math.sin(ang), lx: cx + (R+18)*Math.cos(ang), ly: cy + (R+18)*Math.sin(ang), label: a.label, color: a.color };
  });
  const rings = [0.25, 0.5, 0.75, 1.0].map(r => {
    const pts = axes.map((a,i) => {
      const ang = -Math.PI/2 + i * 2*Math.PI/n;
      return `${cx + R*r*Math.cos(ang)},${cy + R*r*Math.sin(ang)}`;
    }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="#ddd" stroke-width="1"/>`;
  }).join("");
  const dataPoly = points.map(p => `${p.x},${p.y}`).join(" ");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${rings}
    ${axes.map((_,i) => {
      const ang = -Math.PI/2 + i * 2*Math.PI/n;
      return `<line x1="${cx}" y1="${cy}" x2="${cx + R*Math.cos(ang)}" y2="${cy + R*Math.sin(ang)}" stroke="#eee"/>`;
    }).join("")}
    <polygon points="${dataPoly}" fill="rgba(230,126,34,0.25)" stroke="#e67e22" stroke-width="2"/>
    ${points.map((p,i) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${axes[i].color}"/>`).join("")}
    ${points.map(p => `<text x="${p.lx}" y="${p.ly}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#555">${p.label}</text>`).join("")}
  </svg>`;
}

// —— 终端结论卡（monospace 文本）——
function buildTerminalCard(addr, total, emoji, conf, cfNote, scores, D, strengths, weaknesses, topSugs) {
  const pad = (s, n) => String(s).padEnd(n, " ");
  const w = 44;
  const line = "╔" + "═".repeat(w-2) + "╗";
  const sep  = "╠" + "═".repeat(w-2) + "╣";
  const end  = "╚" + "═".repeat(w-2) + "╝";
  const row  = (left, right) => "║ " + pad(left, 12) + pad(right, w-16) + "║";
  let out = line + "\n";
  out += "║ " + pad("🥟 饺子馆选址评估 · 结论卡", w-4) + "║\n";
  out += sep + "\n";
  out += row("点位", addr.slice(0, 28)) + "\n";
  out += row("总分", `${total}/100  ${emoji}`) + "\n";
  out += row("置信度", conf + " " + cfNote.slice(0, 20)) + "\n";
  out += sep + "\n";
  out += row("需求侧", `${scores.demand}/40  (${Math.round(scores.demand/40*100)}%)`) + "\n";
  out += row("位置侧", `${scores.location}/25  (${Math.round(scores.location/25*100)}%)`) + "\n";
  out += row("竞争侧", `${scores.competition}/20  (${Math.round(scores.competition/20*100)}%)`) + "\n";
  out += row("财务侧", scores._hasRent ? `${scores.financial}/15  (${Math.round(scores.financial/15*100)}%)` : "— 未纳入") + "\n";
  out += sep + "\n";
  out += row("优势", strengths[0].name + " 得分率 " + Math.round(strengths[0].score/strengths[0].max*100) + "%") + "\n";
  out += row("", strengths[1].name + " 得分率 " + Math.round(strengths[1].score/strengths[1].max*100) + "%") + "\n";
  out += row("短板", weaknesses[0].name + " 得分率 " + Math.round(weaknesses[0].score/weaknesses[0].max*100) + "%") + "\n";
  out += row("", weaknesses[1].name + " 得分率 " + Math.round(weaknesses[1].score/weaknesses[1].max*100) + "%") + "\n";
  out += sep + "\n";
  topSugs.forEach((s,i) => { out += row(`建议 ${i+1}`, s.slice(0, 28)) + "\n"; });
  out += end;
  return out;
}

function downloadHTML(content, filename) {
  const blob = new Blob([content], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function toggleKeyInputs() {
  const sel = document.getElementById("provider-select").value;
  const amap = document.getElementById("amap-key");
  const baidu = document.getElementById("baidu-key");
  const status = document.getElementById("provider-status");
  amap.style.display = (sel === "amap") ? "" : "none";
  baidu.style.display = (sel === "baidu") ? "" : "none";
  if (sel === "mock") status.textContent = "当前：Mock 模拟数据";
  else if (sel === "amap") status.textContent = "当前：高德 Web API（留 Key 则自动回落 Mock）";
  else status.textContent = "当前：百度 Place API（留 Key 则自动回落 Mock）";
  amap.className = "tag tag-amap"; baidu.className = "tag tag-baidu";
}
